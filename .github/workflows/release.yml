name: MoonFlat GitHub release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Check release tag matches package version
        run: |
          python3 eng/verify-release-metadata.py
          version=$(python3 eng/verify-release-metadata.py --version)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build library
        run: dotnet build src/MoonSharp.Interpreter/MoonFlat.csproj --configuration Release
      - name: Run fork regressions
        run: dotnet run --project tests/MoonFlat.Regression/MoonFlat.Regression.csproj --configuration Release
      - name: Run example
        run: dotnet run --project examples/Basic/Basic.csproj --configuration Release
      - name: Pack MoonFlat
        run: dotnet pack src/MoonSharp.Interpreter/MoonFlat.csproj --configuration Release --no-build --output artifacts/packages
      - name: Restore package consumer from local package
        run: dotnet restore tests/MoonFlat.PackageSmoke/MoonFlat.PackageSmoke.csproj --source artifacts/packages
      - name: Run installed package smoke check
        run: dotnet run --project tests/MoonFlat.PackageSmoke/MoonFlat.PackageSmoke.csproj --configuration Release --no-restore
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=$(find artifacts/packages -maxdepth 1 -name 'MoonFlat.*.nupkg' -print -quit)
          test -n "$package"
          sha256sum "$package" > "$package.sha256"
          gh release upload "$GITHUB_REF_NAME" "$package" "$package.sha256"
